# nginx-sand.conf — Reverse-proxy SAND Vault behind nginx with TLS.
#
# Copy to /etc/nginx/sites-available/sand, then:
#   ln -s /etc/nginx/sites-available/sand /etc/nginx/sites-enabled/
#   certbot --nginx -d sand.example.com   # obtain TLS certificate
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name sand.example.com;         # <-- change to your domain
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sand.example.com;         # <-- change to your domain

    # TLS (managed by certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/sand.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sand.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Upload limit — set to the largest file you expect to archive
    client_max_body_size 512M;

    # Proxy to the SAND Vault server (listening on 127.0.0.1:8080 by default)
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large uploads without premature timeout
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }
}
