<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Paints the phone's own browser chrome to match the app rather than
         leaving a white bar above a dark page. -->
    <meta name="theme-color" content="#0a0e17" />
    <title>SAND Vault — Secure Archival Network Distribution</title>
    <!--
      No external fonts, styles or scripts. The app is served entirely from the
      local binary: fetching a webfont would announce every time you open your
      vault to a third party, which is exactly the kind of leak SAND exists to
      avoid. Typography falls back to whatever the system provides.
    -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script type="module" crossorigin src="/assets/index-DdroCDqh.js"></script>
  </head>
